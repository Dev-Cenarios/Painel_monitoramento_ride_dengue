# ==============================================================================
# Dengue RIDE | deploy/shiny-server.conf
#
# NAO substitua o /etc/shiny-server/shiny-server.conf da sua maquina por este
# arquivo. Ele e um MODELO: copie apenas o bloco `location /dengue_ride { ... }`
# para dentro do seu conf existente, ajustando o caminho da URL e o `app_dir`.
#
# ------------------------------------------------------------------------------
# POR QUE ISSO IMPORTA (e o item de maior impacto do painel em producao)
#
#   Todo o desempenho do Dengue RIDE depende de estado guardado no PROCESSO R:
#     - GEO_DICT, SERIE_MUNICIPIOS, UF_DISPONIVEIS   (global.R, uma vez)
#     - o cache de malhas em disco .malhas_base_cache.rds, carregado na RAM
#     - a VIEW do DuckDB sobre o Parquet
#     - todos os bindCache(): serie_semanal, mapa, tendencia, epi_scanner...
#
#   Por padrao o Shiny Server encerra o processo R poucos segundos depois da
#   ultima conexao cair (app_idle_timeout, default 5s) e leva esse estado
#   junto. Num painel de uso esporadico, quase todo visitante chega num
#   processo recem-nascido e paga o custo de inicializacao inteiro: ~1-4s de
#   global.R + a primeira montagem dos ~7 graficos.
#
#   Com `app_idle_timeout 0` o processo NAO e encerrado por ociosidade. O
#   custo de inicializacao passa a acontecer uma vez por deploy, nao uma vez
#   por usuario.
# ------------------------------------------------------------------------------

run_as shiny;

server {
  listen 3838;

  location /dengue_ride {
    # Diretorio onde o app foi publicado no servidor. Ajuste se necessario.
    app_dir /srv/shiny-server/dengue_ride;

    # Nunca encerrar o processo R por ociosidade. E o ajuste que faz o cache
    # do painel (malhas, series, bindCache) sobreviver entre visitas.
    app_idle_timeout 0;

    # Ate 20 sessoes de navegador compartilhando o MESMO processo R - e,
    # portanto, o mesmo cache. O painel processa consultas de forma serial de
    # qualquer modo; varios processos so criariam varios caches frios.
    simple_scheduler 20;

    # global.R conecta o DuckDB, roda 3 agregacoes e da source em 12 modulos.
    # 60s (default) e curto para a primeira subida, ainda mais em disco lento.
    app_init_timeout 300;

    # Opcional: manter 1 processo sempre quente, mesmo sem ninguem conectado,
    # para que ate o PRIMEIRO acesso depois de um restart ja pegue o app
    # pronto. Requer Shiny Server >= 1.5.18. Descomente se disponivel:
    # preserve_logs true;
    # app_supervisor_msg_interval 5;
  }
}

# ==============================================================================
# COMO APLICAR
#
#   1. Edite /etc/shiny-server/shiny-server.conf e cole o bloco `location`
#      acima dentro do seu `server { ... }` (ao lado dos outros apps).
#   2. sudo shiny-server --version        # confirme que sobe sem erro de sintaxe
#   3. sudo systemctl restart shiny-server
#
# COMO CONFERIR QUE FUNCIONOU
#
#   1. Abra https://SEU_HOST/dengue_ride no navegador, feche a aba.
#   2. Espere 1-2 minutos. No servidor, rode DUAS vezes:
#        pgrep -af "R.*dengue_ride"
#      O PID tem de ser o MESMO nas duas. Se mudar, o processo esta sendo
#      reciclado e o cache descartado a cada visita - reveja o bloco.
#   3. Abra o painel de novo numa aba nova: deve carregar visivelmente mais
#      rapido que o primeiro acesso (global.R ja rodou, malhas ja na RAM).
# ==============================================================================
